# The `dragonfly` CLI: an independent workspace (like editors/).
# It only depends on the transpiler crates (../crates) as a library; the transpiler never depends on it.
[workspace]
resolver = "3"
members = ["dragonfly"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Julian Molina"]
repository = "https://github.com/nuclearlang/dragonfly"
homepage = "https://nuclearlang.github.io"

[workspace.dependencies]
nuclear-diag = { path = "../crates/nuclear-diag" }
nuclear-dialect = { path = "../crates/nuclear-dialect" }
nuclear-transpile = { path = "../crates/nuclear-transpile" }
serde_json = "1"
